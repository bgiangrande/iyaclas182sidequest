    return [...kwKeep(up, [0, 52, 1]), ...kwKeep(up, [0, 52, -1], [0, 90, 1], [1, (m + h / 2) / 2, 1]), ...kwKeep(lo, [0, 52, -1]), ...kwKeep(lo, [0, 52, 1], [0, 14, -1], [1, (m - h / 2 + KW_XH) / 2, -1])]; }],

  <section id="employers" style="position: relative; overflow: hidden">
    <div class="orb" aria-hidden="true" style="width: 520px; height: 300px; background: #9BE7B8; opacity: .7; top: 20px; left: 18%"></div>
    <div class="orb" aria-hidden="true" style="width: 360px; height: 260px; background: #A9C4F5; opacity: .55; top: 60px; right: 14%"></div>
    <div style="position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 24px 96px">
      <div class="lg" style="border-radius: 32px; padding: 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px">
        <div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
          <h2 style="margin: 0; font: 400 42px/1.05 'Instrument Serif', Georgia, serif; letter-spacing: -0.01em">Hiring? Swipe through people who <em>already said yes.</em></h2>
          <p style="margin: 0; font-size: 17px; line-height: 1.55; color: #2E3F37">Post a role or a task in minutes. You only see candidates who swiped right on you, and you can chat the moment you match.</p>
        </div>
        <a class="lg-ink lgb" href="#demo" style="display: inline-flex; align-items: center; height: 52px; padding: 0 26px; border-radius: 999px; font-weight: 500; font-size: 15px; letter-spacing: 0.01em">Post a listing</a>
      </div>
    </div>
  </section>

  
  <div style="background: #F2EFE9; padding: 0 clamp(12px, 1.5vw, 24px) 12px">
  <footer ref=${v.kwfRef} class=${v.kwfClass} >
    <div class="kwf-in-wrap">
      <p class="kwf-sr">sidequest</p>
      <svg class="kwf-word" viewBox=${v.kwViewBox} aria-hidden="true" onPointerMove=${v.kwWordMove} onPointerLeave=${v.kwWordLeave}>
        ${(v.kwLetters || []).map((l, $index) => html`
          <g class="kwf-l" style="transition-delay: ${l.delay}"><path ref=${l.ref} d=${l.d} fill="#173D2B" onClick=${l.stamp}></path></g>
        `)}
      </svg>
    </div>
  </footer>
  </div>
</div>`;
SideQuest.prototype.render = function () { return tpl(this.renderVals()); };
render(h(SideQuest, {}), document.getElementById('root'));
